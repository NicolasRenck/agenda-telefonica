{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agenda — Excluir Contato</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0e11;
      --surface: #1a1820;
      --danger: #e05c5c;
      --danger-dim: rgba(224,92,92,0.1);
      --text: #ede9e3;
      --muted: #7a7585;
      --accent: #c8a96e;
      --radius: 14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0; opacity: 0.4;
    }

    body::after {
      content: '';
      position: fixed;
      width: 350px; height: 350px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(224,92,92,0.07) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .card {
      background: var(--surface);
      border: 1px solid #2e2a38;
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 1;
      text-align: center;
      animation: fadeUp 0.35s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .icon-wrap {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: var(--danger-dim);
      border: 1px solid rgba(224,92,92,0.25);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
      animation: pulse 2s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(224,92,92,0.15); }
      50% { box-shadow: 0 0 0 10px rgba(224,92,92,0); }
    }

    h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.7rem;
      letter-spacing: -0.02em;
      margin-bottom: 0.6rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 0.5rem;
    }

    .contact-name {
      display: inline-block;
      font-weight: 700;
      color: var(--text);
      background: #221f2b;
      border: 1px solid #3d3850;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      font-size: 0.95rem;
      margin: 0.75rem 0 1.5rem;
    }

    .warning {
      background: var(--danger-dim);
      border: 1px solid rgba(224,92,92,0.2);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      font-size: 0.82rem;
      color: var(--danger);
      margin-bottom: 1.75rem;
      text-align: left;
      display: flex;
      gap: 0.5rem;
      align-items: flex-start;
    }

    .btn-row { display: flex; gap: 0.75rem; }

    .btn {
      flex: 1;
      padding: 0.85rem;
      border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-cancel { background: transparent; border: 1px solid #2e2a38; color: var(--muted); }
    .btn-cancel:hover { border-color: var(--muted); color: var(--text); }

    .btn-delete { background: var(--danger); color: #fff; }
    .btn-delete:hover { background: #eb7070; transform: translateY(-1px); }
    .btn-delete:active { transform: translateY(0); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#e05c5c" stroke-width="2" stroke-linecap="round">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14H6L5 6"/>
        <path d="M10 11v6M14 11v6"/>
        <path d="M9 6V4h6v2"/>
      </svg>
    </div>

    <h2>Excluir contato</h2>
    <p class="subtitle">Você está prestes a excluir permanentemente:</p>

    <span class="contact-name">{{ agenda.contato }}</span>

    <div class="warning">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Esta ação não pode ser desfeita. O contato será removido definitivamente.
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="btn-row">
        <a href="{% url 'agenda' %}" class="btn btn-cancel">Cancelar</a>
        <button type="submit" class="btn btn-delete">Sim, excluir</button>
      </div>
    </form>
  </div>
</body>
</html>
