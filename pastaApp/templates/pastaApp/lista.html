{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agenda | Contatos</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0e11;
      --surface: #1a1820;
      --surface2: #221f2b;
      --accent: #c8a96e;
      --accent2: #9b6fff;
      --text: #ede9e3;
      --muted: #7a7585;
      --danger: #e05c5c;
      --radius: 14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid #2e2a38;
      padding-bottom: 1.5rem;
    }

    .logo-group h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2.4rem;
      letter-spacing: -0.03em;
      color: var(--text);
      line-height: 1;
    }

    .logo-group span {
      font-size: 0.78rem;
      color: var(--accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1.25rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      color: #0f0e11;
    }
    .btn-primary:hover { background: #dbbe88; transform: translateY(-1px); }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid #2e2a38;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid transparent;
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
    }
    .btn-danger:hover { border-color: var(--danger); background: rgba(224,92,92,0.08); }

    .btn-edit {
      background: transparent;
      color: var(--accent2);
      border: 1px solid transparent;
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
    }
    .btn-edit:hover { border-color: var(--accent2); background: rgba(155,111,255,0.08); }

    .search-bar {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .search-bar input {
      width: 100%;
      background: var(--surface);
      border: 1px solid #2e2a38;
      border-radius: var(--radius);
      padding: 0.85rem 1rem 0.85rem 2.8rem;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }
    .search-bar input:focus { border-color: var(--accent); }
    .search-bar input::placeholder { color: var(--muted); }

    .search-bar svg {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .contact-list { display: flex; flex-direction: column; gap: 0.75rem; }

    .contact-card {
      background: var(--surface);
      border: 1px solid #2e2a38;
      border-radius: var(--radius);
      padding: 1.1rem 1.4rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: border-color 0.2s, transform 0.15s;
      animation: slideIn 0.3s ease both;
    }

    .contact-card:hover { border-color: #3d3850; transform: translateX(3px); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Serif Display', serif;
      font-size: 1.2rem;
      color: #fff;
      flex-shrink: 0;
    }

    .contact-info { flex: 1; }
    .contact-info strong { display: block; font-weight: 600; font-size: 1rem; }
    .contact-info small { color: var(--muted); font-size: 0.85rem; }

    .contact-actions { display: flex; gap: 0.25rem; }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }
    .empty-state p { font-size: 1.05rem; margin-bottom: 1.25rem; }

    .tag {
      display: inline-block;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: var(--surface2);
      color: var(--muted);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-group">
        <span>Minha</span>
        <h1>Agenda</h1>
      </div>
      <a href="{% url 'add_contato' %}" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Novo contato
      </a>
    </header>

    <div class="search-bar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar contato..." oninput="filterContacts()"/>
    </div>

    <div class="contact-list" id="contactList">
      {% for contato in agenda %}
      <div class="contact-card" data-name="{{ contato.contato|lower }}">
        <div class="avatar">{{ contato.contato|first|upper }}</div>
        <div class="contact-info">
          <strong>{{ contato.contato }}</strong>
          <small>{{ contato.numero }}</small>
        </div>
        <div class="contact-actions">
          <a href="{% url 'editar_contato' contato.pk %}" class="btn btn-edit">Editar</a>
          <a href="{% url 'deletar_contato' contato.pk %}" class="btn btn-danger">Excluir</a>
        </div>
      </div>
      {% empty %}
      <div class="empty-state">
        <p>Nenhum contato ainda.</p>
        <a href="{% url 'add_contato' %}" class="btn btn-primary">Adicionar primeiro contato</a>
      </div>
      {% endfor %}
    </div>
  </div>

  <script>
    function filterContacts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.contact-card').forEach(card => {
        card.style.display = card.dataset.name.includes(query) ? 'flex' : 'none';
      });
    }

    // Staggered animation
    document.querySelectorAll('.contact-card').forEach((card, i) => {
      card.style.animationDelay = `${i * 0.05}s`;
    });
  </script>
</body>
</html>
