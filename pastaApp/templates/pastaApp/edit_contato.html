{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agenda | Editar Contato</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0e11;
      --surface: #1a1820;
      --accent: #9b6fff;
      --text: #ede9e3;
      --muted: #7a7585;
      --radius: 14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0; opacity: 0.4;
    }

    body::after {
      content: '';
      position: fixed;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(155,111,255,0.1) 0%, transparent 70%);
      bottom: -80px; right: -80px;
      pointer-events: none;
    }

    .card {
      background: var(--surface);
      border: 1px solid #2e2a38;
      border-top: 3px solid var(--accent);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
      animation: fadeUp 0.4s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--muted);
      text-decoration: none;
      margin-bottom: 1.2rem;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent); }

    .badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: rgba(155,111,255,0.15);
      color: var(--accent);
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      margin-bottom: 0.75rem;
    }

    h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.9rem;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 0.4rem;
    }

    .subtitle { color: var(--muted); font-size: 0.88rem; margin-bottom: 1.75rem; }

    .divider { height: 1px; background: #2e2a38; margin-bottom: 1.75rem; }

    .form-group { margin-bottom: 1.25rem; }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    input[type="text"], input[type="tel"] {
      width: 100%;
      background: #0f0e11;
      border: 1px solid #2e2a38;
      border-radius: var(--radius);
      padding: 0.85rem 1rem;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(155,111,255,0.12);
    }

    input::placeholder { color: var(--muted); }

    .btn-row { display: flex; gap: 0.75rem; margin-top: 0.5rem; }

    .btn {
      flex: 1;
      padding: 0.85rem;
      border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #b589ff; transform: translateY(-1px); }

    .btn-ghost { background: transparent; border: 1px solid #2e2a38; color: var(--muted); }
    .btn-ghost:hover { border-color: var(--muted); color: var(--text); }
  </style>
</head>
<body>
  <div class="card">
    <a href="{% url 'agenda' %}" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Voltar
    </a>

    <div class="badge">Editando</div>
    <h2>Editar<br/>Contato</h2>
    <p class="subtitle">Altere os dados do contato abaixo.</p>

    <div class="divider"></div>

    <form method="post">
      {% csrf_token %}

      <div class="form-group">
        <label for="id_nome">Nome</label>
        <input type="text" name="contato" id="id_contato" value="{{ form.nome.value }}" placeholder="Nome do contato" required/>
      </div>

      <div class="form-group">
        <label for="id_numero">Número</label>
        <input type="tel" name="numero" id="id_numero" value="{{ form.numero.value }}" placeholder="(51) 9 9999-9999" required/>
      </div>

      <div class="btn-row">
        <a href="{% url 'agenda' %}" class="btn btn-ghost">Cancelar</a>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>
  </div>
</body>
</html>
